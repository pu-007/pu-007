name: Update README Cards

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stats.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test card generation
        run: node --test tests/*.test.mjs
      - name: Generate and validate public profile cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-cards.mjs
      - name: Commit validated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/top-langs.svg assets/top-langs-mobile.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public profile cards'
            git pull --rebase origin main
            git push
          fi
